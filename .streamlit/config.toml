[theme]
base = "light"
primaryColor = "#0284C7"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
baseRadius = "14px"
buttonRadius = "10px"

[client]
toolbarMode = "minimal"

[server]
port = 8901  # Windows reserves 8462-8861 on this machine, including the default 8501
maxUploadSize = 2048  # MB. Allow up to 2 GB videos
maxMessageSize = 2048
